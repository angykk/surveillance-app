name: mobile
description: "Turns a spare phone into a motion-recording camera that other phones can watch live."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  video_player: ^2.9.2
  flutter_webrtc: ^1.6.2+hotfix.2
  socket_io_client: ^3.1.6
  flutter_dotenv: ^6.0.1
  opencv_dart: ^2.2.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  supabase_flutter: ^2.18.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.2.0
  livekit_client: ^2.13.1
  wakelock_plus: ^1.6.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/

hooks:
  user_defines:
    dartcv4:
      # imgcodecs: imdecode. imgproc: threshold/dilate/findContours/etc.
      # video: BackgroundSubtractorMOG2. dnn: the person detector's model.
      # All used by motion_detector.dart.
      include_modules:
        - dnn
        - imgcodecs
        - imgproc
        - video
